<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBSTAWIANIE | FAME 31</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Barlow:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --red: #E8002A;
            --red-dark: #9B0019;
            --red-deep: #5A000F;
            --white: #FFFFFF;
            --off-white: #F0EEEC;
            --black: #080808;
            --grey: #888;
            --grey-light: #CCCCCC;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Barlow', sans-serif;
            background-color: var(--black);
            color: var(--white);
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        body.modal-open { overflow: hidden; }

        /* BG PATTERN - kratka jak na screenie */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 40px),
                repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 40px);
            pointer-events: none;
            z-index: 0;
        }

        /* Czerwona nakładka górna */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 60vh;
            background: radial-gradient(ellipse at 50% -10%, rgba(180,0,30,0.6) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        #root { position: relative; z-index: 1; }

        /* HEADER */
        .site-header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            height: 64px;
            background: rgba(8,8,8,0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .site-logo {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 900;
            font-style: italic;
            font-size: 28px;
            letter-spacing: -1px;
            color: var(--white);
        }

        .site-logo span { color: var(--red); }

        .header-nav {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .header-nav a, .header-nav button {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--grey-light);
            text-decoration: none;
            transition: color 0.2s;
            background: none;
            border: none;
            cursor: pointer;
        }

        .header-nav a:hover, .header-nav button:hover { color: var(--white); }

        .btn-login {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 900;
            font-size: 13px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--white);
            background: transparent;
            border: 2px solid var(--white);
            padding: 8px 22px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            white-space: nowrap;
        }

        .btn-login:hover {
            background: var(--white);
            color: var(--black);
        }
        
        .header-user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .header-user-nick {
            color: rgba(255,255,255,0.7);
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
        }

        /* HERO */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 100px 20px 60px;
            position: relative;
        }

        .hero-bg-text {
            position: absolute;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 900;
            font-style: italic;
            font-size: clamp(120px, 25vw, 280px);
            color: transparent;
            -webkit-text-stroke: 1px rgba(255,255,255,0.06);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
            line-height: 1;
        }

        .hero-event-label {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.4);
            margin-bottom: 16px;
        }

        .hero-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 900;
            font-style: italic;
            font-size: clamp(80px, 16vw, 160px);
            line-height: 0.9;
            letter-spacing: -2px;
            text-transform: uppercase;
            color: var(--white);
            margin-bottom: 8px;
            position: relative;
        }

        .hero-title sup {
            font-size: 0.3em;
            color: var(--red);
            vertical-align: super;
        }

        .hero-date {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.5);
            margin-bottom: 48px;
        }
        
        #main-content-anchor {
            display: block;
            position: relative;
            top: -64px; /* header height */
            visibility: hidden;
        }

        /* TIMER */
        .timer-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 52px;
            width: 100%;
            max-width: 340px;
        }

        .timer-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 8px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.03);
        }

        .timer-num {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 900;
            font-style: italic;
            font-size: 40px;
            line-height: 1;
            color: var(--white);
        }

        .timer-label {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
            margin-top: 4px;
        }

        /* BUTTONS */
        .btn-primary {
            display: block;
            width: 100%;
            max-width: 360px;
            padding: 18px 32px;
            background: var(--red);
            color: var(--white);
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 900;
            font-size: 15px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
            text-decoration: none;
            margin-bottom: 10px;
        }

        .btn-primary:hover { background: #C8001F; }
        .btn-primary:disabled { background: var(--grey); cursor: not-allowed; }

        .btn-secondary {
            display: block;
            width: 100%;
            max-width: 360px;
            padding: 17px 32px;
            background: transparent;
            color: var(--white);
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 900;
            font-size: 15px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            border: 2px solid rgba(255,255,255,0.4);
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            text-decoration: none;
            margin-bottom: 10px;
        }

        .btn-secondary:hover {
            border-color: var(--white);
            background: rgba(255,255,255,0.05);
        }

        .btn-outline-red {
            display: block;
            width: 100%;
            max-width: 360px;
            padding: 17px 32px;
            background: transparent;
            color: var(--white);
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 900;
            font-size: 15px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            border: 2px solid rgba(232,0,42,0.5);
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            margin-bottom: 10px;
        }

        .btn-outline-red:hover {
            border-color: var(--red);
            background: rgba(232,0,42,0.1);
        }

        /* MAIN CONTENT */
        .main-content {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 24px 80px;
        }

        /* SECTION DIVIDER */
        .section-divider {
            width: 100%;
            height: 1px;
            background: rgba(255,255,255,0.08);
            margin: 48px 0;
            position: relative;
        }

        .section-divider::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 60px;
            height: 2px;
            background: var(--red);
            top: -0.5px;
        }

        /* SECTION TITLE */
        .section-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 900;
            font-style: italic;
            font-size: clamp(32px, 6vw, 52px);
            text-transform: uppercase;
            letter-spacing: -1px;
            color: var(--white);
            margin-bottom: 6px;
        }

        .section-subtitle {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.3);
            margin-bottom: 32px;
        }

        /* NICK INPUT */
        .nick-input-wrap {
            margin-bottom: 40px;
        }

        .nick-label {
            display: block;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.4);
            margin-bottom: 10px;
        }

        .nick-input {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.15);
            border-bottom: 2px solid var(--red);
            padding: 16px 20px;
            color: var(--white);
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 22px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }
        
        .nick-input.code-input {
            font-size: 28px;
            text-align: center;
            letter-spacing: 0.3em;
            border-bottom-color: var(--grey);
        }
        .nick-input.code-input:focus {
            border-bottom-color: var(--red);
        }

        .nick-input:focus {
            background: rgba(255,255,255,0.07);
            border-bottom-color: var(--white);
        }

        .nick-input::placeholder { color: rgba(255,255,255,0.2); }

        /* FIGHT CARD */
        .fight-card {
            border: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 12px;
            background: rgba(255,255,255,0.02);
            transition: border-color 0.2s;
            overflow: hidden;
        }

        .fight-card:hover { border-color: rgba(255,255,255,0.2); }

        .fight-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: rgba(255,255,255,0.03);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .fight-num {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 900;
            font-style: italic;
            font-size: 12px;
            color: var(--red);
            letter-spacing: 0.1em;
        }

        .fight-cat {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 11px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
        }

        .fight-pick-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
        }

        .pick-btn {
            padding: 20px 12px;
            background: transparent;
            border: none;
            border-right: 1px solid rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.5);
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 900;
            font-style: italic;
            font-size: clamp(13px, 2.5vw, 18px);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            line-height: 1.2;
        }

        .pick-btn:last-child { border-right: none; }

        .pick-btn:hover {
            background: rgba(255,255,255,0.05);
            color: var(--white);
        }

        .pick-btn.selected {
            background: var(--red);
            color: var(--white);
        }

        .pick-badge {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.2em;
            font-style: normal;
            opacity: 0.7;
            background: rgba(0,0,0,0.2);
            padding: 2px 8px;
        }

        /* VS DIVIDER */
        .vs-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 900;
            font-style: italic;
            font-size: 13px;
            color: rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.03);
            border-left: 1px solid rgba(255,255,255,0.08);
            border-right: 1px solid rgba(255,255,255,0.08);
            width: 40px;
            flex-shrink: 0;
        }

        /* STAKE SLIDER */
        .stake-area {
            padding: 14px 16px;
            border-top: 1px solid rgba(255,255,255,0.06);
            background: rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .stake-info {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: rgba(255,255,255,0.4);
            white-space: nowrap;
        }

        .stake-val { color: var(--red); }
        .stake-win { color: rgba(100,220,100,0.8); }

        .fc-slider {
            flex: 1;
            -webkit-appearance: none;
            height: 2px;
            background: rgba(255,255,255,0.1);
            outline: none;
        }

        .fc-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--red);
            cursor: pointer;
            border: 2px solid white;
        }

        /* WALLET BADGE */
        .wallet-badge {
            position: fixed;
            top: 64px;
            left: 0;
            right: 0;
            z-index: 90;
            background: rgba(8,8,8,0.95);
            border-bottom: 2px solid var(--red);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 10px 20px;
            backdrop-filter: blur(20px);
        }

        .wallet-label {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
        }

        .wallet-val {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 900;
            font-style: italic;
            font-size: 22px;
            color: var(--white);
        }

        .wallet-val span { color: var(--red); }

        /* TABS */
        .tab-row {
            display: flex;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 40px;
            gap: 0;
        }

        .tab-btn {
            flex: 1;
            padding: 16px 8px;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            color: rgba(255,255,255,0.35);
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 900;
            font-size: 13px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn:hover { color: rgba(255,255,255,0.7); }

        .tab-btn.active {
            color: var(--white);
            border-bottom-color: var(--red);
        }

        /* LEADERBOARD */
        .lb-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background 0.15s;
        }

        .lb-row:hover { background: rgba(255,255,255,0.03); }

        .lb-rank {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 900;
            font-style: italic;
            font-size: 24px;
            width: 40px;
            color: rgba(255,255,255,0.15);
        }

        .lb-rank.gold { color: #D4A820; }
        .lb-rank.silver { color: #A0A0A0; }
        .lb-rank.bronze { color: #8B5E3C; }

        .lb-nick {
            flex: 1;
            padding: 0 16px;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--white);
        }

        .lb-score {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 900;
            font-style: italic;
            font-size: 20px;
            color: var(--red);
        }

        /* STORE / CASINO */
        .store-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }

        .store-card {
            border: 1px solid rgba(255,255,255,0.08);
            padding: 28px 20px;
            text-align: center;
            transition: border-color 0.2s, background 0.2s;
            background: rgba(255,255,255,0.02);
        }

        .store-card:hover {
            border-color: var(--red);
            background: rgba(232,0,42,0.04);
        }

        .store-icon { font-size: 36px; margin-bottom: 16px; display: block; }

        .store-name {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 900;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--white);
            margin-bottom: 8px;
        }

        .store-desc {
            font-size: 12px;
            color: rgba(255,255,255,0.35);
            line-height: 1.6;
            margin-bottom: 20px;
            min-height: 54px;
        }

        .store-buy-btn {
            display: block;
            width: 100%;
            padding: 13px;
            background: var(--red);
            color: var(--white);
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 900;
            font-size: 13px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .store-buy-btn:hover { background: #C8001F; }
        .store-buy-btn.purple { background: #7c3aed; }
        .store-buy-btn.purple:hover { background: #6d28d9; }
        .store-buy-btn.blue { background: #1d4ed8; }
        .store-buy-btn.blue:hover { background: #1e40af; }

        /* CASINO */
        .casino-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
        }

        .casino-card {
            border: 1px solid rgba(255,255,255,0.08);
            padding: 24px 16px;
            text-align: center;
            position: relative;
            overflow: hidden;
            background: rgba(255,255,255,0.02);
            transition: border-color 0.2s;
        }

        .casino-card:hover { border-color: rgba(255,255,255,0.25); }
        .casino-card.gold-card { border-color: rgba(212,168,32,0.4); }
        .casino-card.gold-card:hover { border-color: #D4A820; }

        .casino-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 16px;
        }

        .casino-name {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 900;
            font-size: 16px;
            text-transform: uppercase;
            color: var(--white);
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }

        .casino-max {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: 0.15em;
        }

        .casino-open-btn {
            display: block;
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            background: transparent;
            color: rgba(255,255,255,0.7);
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 900;
            font-size: 12px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .casino-open-btn:disabled {
            border-color: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.2);
            cursor: not-allowed;
        }
        
        .casino-open-btn:disabled:hover {
            background: transparent;
        }

        .casino-open-btn:hover {
            background: rgba(255,255,255,0.08);
            color: var(--white);
        }

        .casino-open-btn.gold-btn {
            border-color: rgba(212,168,32,0.6);
            color: #D4A820;
        }

        .casino-open-btn.gold-btn:hover {
            background: rgba(212,168,32,0.15);
            border-color: #D4A820;
        }

        .jackpot-badge {
            position: absolute;
            top: 0; left: 0; right: 0;
            background: var(--red);
            padding: 4px 8px;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 900;

                                    <div style={{maxHeight: '40vh', overflowY: 'auto', border: '1px solid rgba(255,255,255,0.1)'}}>
                                        <table className="admin-table">
                                            <thead><tr><th>{t('code')}</th><th>{t('value')}</th><th>{t('used')}</th><th>{t('usedBy')}</th><th></th></tr></thead>
                                            <tbody>
                                                {Object.entries(promoCodes).sort(([,a],[,b]) => (a.usedAt || "") < (b.usedAt || "") ? 1 : -1).map(([code, data]) => (
                                                    <tr key={code}>
                                                        <td className="code-col">{code}</td>
                                                        <td>{data.amount} FC</td>
                                                        <td style={{color: data.used ? '#4ade80' : 'inherit'}}>{data.used ? t('yes') : t('no')}</td>
                                                        <td>{data.usedBy || '-'}</td>
                                                        <td><button onClick={() => {if(confirm(`${t('deleteCodeConfirm')} (${code})`)) db.ref('promo_codes/' + code).remove()}} style={{color: 'var(--red)', background: 'none', border: 'none', cursor: 'pointer'}}>X</button></td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                                
                                <div style={{display:'flex', gap:'12px', marginTop: '40px'}}>
                                    <button onClick={() => { if(confirm(t('clearResultsConfirm'))) db.ref('official_results').remove(); }} style={{flex:1, padding:'16px', background:'transparent', border:'1px solid rgba(232,0,42,0.3)', color:'rgba(232,0,42,0.7)', fontFamily:'Barlow Condensed', fontWeight:900, fontSize:'13px', textTransform:'uppercase', letterSpacing:'0.15em', cursor:'pointer'}}>{t('clearResults')}</button>
                                    <button onClick={() => setView('home')} className="btn-primary" style={{flex:2, marginBottom:0}}>{t('goBack')}</button>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }
            
            // ---- MAIN VIEW ----
            return (
                <div>
                    {/* MODALS */}
                    <div className={`modal-overlay ${showFaqModal ? 'visible' : ''}`} onClick={() => setShowFaqModal(false)}>
                        <div className="modal-content" onClick={e => e.stopPropagation()}>
                            <button className="modal-close-btn" onClick={() => setShowFaqModal(false)}>&times;</button>
                            <h2 className="section-title" style={{marginBottom: '32px'}}>{t('faqTitle')}</h2>
                            {faqData.map((item, index) => (
                                <div className={`faq-item ${openFaq === index ? 'open' : ''}`} key={index}>
                                    <button className="faq-q" onClick={() => setOpenFaq(openFaq === index ? null : index)}>
                                        {item.q[lang]}
                                    </button>
                                    <div className="faq-a" dangerouslySetInnerHTML={{ __html: item.a[lang] }} />
                                </div>
                            ))}
                        </div>
                    </div>
                    
                    <div className={`modal-overlay ${showRedeemModal ? 'visible' : ''}`} onClick={() => setShowRedeemModal(false)}>
                        <div className="modal-content" onClick={e => e.stopPropagation()}>
                            <button className="modal-close-btn" onClick={() => setShowRedeemModal(false)}>&times;</button>
                             <h2 className="section-title">{t('redeemCodeTitle')}</h2>
                             <p className="section-subtitle">{t('redeemCodeSub')}</p>
                             <input 
                                className="nick-input code-input"
                                placeholder="FAME-XXXX"
                                value={redeemCodeInput}
                                onChange={e => setRedeemCodeInput(e.target.value)}
                                maxLength="12"
                             />
                             <button onClick={handleRedeemCode} className="btn-primary" style={{maxWidth: '100%', marginTop: '24px'}}>{t('redeem')}</button>
                        </div>
                    </div>


                    {/* HEADER */}
                    <header className="site-header">
                        <div className="site-logo" onClick={() => { const c = secretClicks+1; setSecretClicks(c); if(c===5) setView('admin'); }} style={{cursor:'default'}}>FÁ<span>M</span>E</div>
                        <nav className="header-nav">
                            <a href={DISCORD_INVITE_URL} target="_blank" rel="noopener noreferrer">{t('watchOnTv')}</a>
                            <button onClick={() => setShowFaqModal(true)}>{t('faq')}</button>
                            <button onClick={() => setShowRedeemModal(true)}>{t('redeemCode')}</button>
                            <button onClick={() => setLang(lang === 'pl' ? 'en' : 'pl')}>{lang.toUpperCase()}</button>
                        </nav>
                        {nick ? (
                            <div className="header-user-info">
                                <span className="header-user-nick">{nick.split('#')[0]}</span>
                                <button onClick={handleLogout} className="btn-login" style={{borderColor: 'var(--grey)', color: 'var(--grey)'}}>{t('logout')}</button>
                            </div>
                        ) : (
                             <a href={discordAuthUrl} className="btn-login">{t('loginWithDiscord')}</a>
                        )}
                    </header>

                    {/* WALLET BAR */}
                    {(userBet || nick) && !showTerms && (
                        <div className="wallet-badge">
                            <span className="wallet-label">{t('yourBalance')}</span>
                            <span className="wallet-val">{userCurrentBalance} <span>FC</span></span>
                        </div>
                    )}

                    {/* TOAST */}
                    <div className={`toast ${toast.show ? 'visible' : ''}`}>
                        <p className="toast-msg">{toast.msg}</p>
                    </div>

                    {/* INTRO OVERLAY */}
                    {showTerms && (
                        <div className="intro-overlay">
                            <div className="intro-box">
                                <p className="intro-title">FÁME<sup style={{color:'#E8002A', fontSize:'0.35em', verticalAlign:'super'}}>31</sup></p>
                                <p className="intro-sub">{t('heroLabel')}</p>
                                <div className="rules-box">
                                    <p className="rules-title">{t('rulesTitle')}</p>
                                    {[...Array(4)].map((_, i) => (
                                        <div className="rule-item" key={i}><div className="rule-bullet"></div><p className="rule-text" dangerouslySetInnerHTML={{__html: t(`rule${i+1}`)}}></p></div>
                                    ))}
                                </div>
                                <button className="btn-primary" style={{maxWidth:'100%', fontSize:'16px', padding:'22px'}} onClick={() => { setShowTerms(false); showNotify(userBet || nick ? t('welcomeBack') : t('goodLuck')); }}>{t('enterGame')}</button>
                            </div>
                        </div>
                    )}

                    {/* HERO */}
                    <section className="hero">
                        <div className="hero-bg-text">FAME</div>
                        <p className="hero-event-label">{t('heroLabel')}</p>
                        <h1 className="hero-title">FÁ<span style={{color:'#E8002A'}}>ME</span><sup style={{color:'#E8002A', fontSize:'0.2em', verticalAlign:'super'}}>31</sup></h1>
                        <p className="hero-date">{t('dateLabel')}</p>

                        <div className="timer-row">
                            {[{v:timeLeft.d,l:t('days')},{v:timeLeft.h,l:t('hours')},{v:timeLeft.m,l:t('mins')},{v:timeLeft.s,l:t('secs')}].map(time => (
                                <div key={time.l} className="timer-cell">
                                    <span className="timer-num">{String(time.v).padStart(2,'0')}</span>
                                    <span className="timer-label">{time.l}</span>
                                </div>
                            ))}
                        </div>

                        <a href="#main-content-anchor" className="btn-primary">{t('betNow')}</a>
                        <a href={DISCORD_INVITE_URL} target="_blank" rel="noopener noreferrer" className="btn-secondary">{t('watch')}</a>
                    </section>
                    
                    <div id="main-content-anchor"></div>
                    <main className="main-content">
                         <div className="section-divider"></div>
                         
                         {userBet ? (
                             <div>
                                <div className="tab-row">
                                    <button className={`tab-btn ${currentTab === 'ticket' ? 'active' : ''}`} onClick={() => setCurrentTab('ticket')}>{t('myTicket')}</button>
                                    <button className={`tab-btn ${currentTab === 'store' ? 'active' : ''}`} onClick={() => setCurrentTab('store')}>{t('shop')}</button>
                                    <button className={`tab-btn ${currentTab === 'cases' ? 'active' : ''}`} onClick={() => setCurrentTab('cases')}>{t('casino')}</button>
                                </div>
                                {currentTab === 'ticket' && (
                                    <div>
                                        <div className="balance-hero">
                                            <p className="balance-label">{t('yourBalance')}</p>
                                            <p className="balance-num">{userCurrentBalance}</p>
                                            <p className="balance-currency">{t('famecoins')}</p>
                                            <p style={{marginTop:'16px', fontFamily:'Barlow Condensed', fontSize:'12px', fontWeight:700, letterSpacing:'0.2em', textTransform:'uppercase', color:'rgba(255,255,255,0.25)'}}>
                                                <span className="waiting-dot"></span>{t('waitingForResults')}
                                            </p>
                                        </div>

                                        <div className="ticket">
                                            <div className="ticket-header">
                                                <div>
                                                    <p className="ticket-title">{t('ticketHeader')}</p>
                                                    <p className="ticket-nick">{userBet.nick}</p>
                                                </div>
                                                <div style={{textAlign:'right'}}>
                                                    <p style={{fontFamily:'Barlow Condensed', fontSize:'11px', fontWeight:700, letterSpacing:'0.2em', color:'rgba(255,255,255,0.25)', textTransform:'uppercase'}}>{t('saved')}</p>
                                                    <p style={{fontFamily:'Barlow Condensed', fontSize:'12px', fontWeight:700, color:'rgba(255,255,255,0.4)'}}>{userBet.date}</p>
                                                </div>
                                            </div>

                                            {FIGHTS.map(f => {
                                                const res = officialResults[f.id];
                                                const userPick = userBet.picks[f.id];
                                                const fighterName = userPick?.fighter || userPick;
                                                const stake = userPick?.stake || 0;
                                                let cls = 'pending';
                                                if (res) { cls = res === fighterName ? 'win' : res === 'REMIS' ? 'draw' : 'lose'; }

                                                return (
                                                    <div key={f.id} className="ticket-row">
                                                        <span className="ticket-cat">{f.cat}</span>
                                                        <div style={{textAlign:'right'}}>
                                                            <p className={`ticket-pick ${cls}`}>{fighterName}</p>
                                                            <p className="ticket-stake">{t('stake')}: {stake} FC · {t('win')}: +{stake*2} FC</p>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}
                                {currentTab === 'store' && (
                                    <div>
                                        <p className="section-title">{t('shopTitle')}</p>
                                        <p className="section-subtitle">{t('shopSub')}</p>
                                        <div className="store-grid">
                                            <div className="store-card">
                                                <span className="store-icon">🎟️</span>
                                                <p className="store-name">Kupon FAME 32</p>
                                                <p className="store-desc">Darmowy dostęp do restreamu z kolejnej gali.</p>
                                                <button className="store-buy-btn" onClick={() => handleBuyStoreItem('KUPON FAME 32', 5000)}>Kup za 5000 FC</button>
                                            </div>
                                            <div className="store-card">
                                                <span className="store-icon">🟣</span>
                                                <p className="store-name">Ranga VIP</p>
                                                <p className="store-desc">Unikalna ranga VIP na serwerze Discord.</p>
                                                <button className="store-buy-btn purple" onClick={() => handleBuyStoreItem('RANGA VIP DISCORD', 2500)}>Kup za 2500 FC</button>
                                            </div>
                                            <div className="store-card">
                                                <span className="store-icon">🎨</span>
                                                <p className="store-name">Kolor Nicku</p>
                                                <p className="store-desc">Własny kolor nicku na Discordzie.</p>
                                                <button className="store-buy-btn blue" onClick={() => handleBuyStoreItem('KOLOR NICKU', 1000)}>Kup za 1000 FC</button>
                                            </div>
                                        </div>
                                    </div>
                                )}
                                {currentTab === 'cases' && (
                                    <div>
                                        <p className="section-title" style={{color:'#E8002A'}}>{t('casinoTitle')}</p>
                                        <p className="section-subtitle">{t('casinoSub')}</p>

                                        {spinResult && (
                                            <div className="spin-result">
                                                <p className="spin-result-txt">{spinResult}</p>
                                            </div>
                                        )}

                                        <div className="casino-grid">
                                            <div className="casino-card">
                                                <span className={`casino-icon ${isSpinning ? 'spinning-icon' : ''}`}>📦</span>
                                                <p className="casino-name">Biedaka</p>
                                                <p className="casino-max">Max Drop: 1000 FC</p>
                                                <button className="casino-open-btn" disabled={isSpinning} onClick={() => openCase('Biedaka', 350, [{chance:0.5, amount:0}, {chance:0.3, amount:200}, {chance:0.15, amount:400}, {chance:0.05, amount:1000}])}>
                                                    {t('open')} (350 FC)
                                                </button>
                                            </div>
                                            <div className="casino-card">
                                                <span className={`casino-icon ${isSpinning ? 'spinning-icon' : ''}`}>🧰</span>
                                                <p className="casino-name">Gracza</p>
                                                <p className="casino-max">Max Drop: 2000 FC</p>
                                                <button className="casino-open-btn" disabled={isSpinning} onClick={() => openCase('Gracza', 500, [{chance:0.5, amount:0}, {chance:0.25, amount:300}, {chance:0.20, amount:800}, {chance:0.05, amount:2000}])}>
                                                    {t('open')} (500 FC)
                                                </button>
                                            </div>
                                            <div className="casino-card gold-card">
                                                <div className="jackpot-badge">{t('jackpot')}</div>
                                                <span className={`casino-icon ${isSpinning ? 'spinning-icon' : ''}`} style={{marginTop:'16px'}}>👑</span>
                                                <p className="casino-name" style={{color:'#D4A820'}}>Złota Premium</p>
                                                <p className="casino-max" style={{color:'rgba(212,168,32,0.5)'}}>Max Drop: 5000 FC</p>
                                                <button className="casino-open-btn gold-btn" disabled={isSpinning} onClick={() => openCase('Złota', 1000, [{chance:0.55, amount:0}, {chance:0.25, amount:500}, {chance:0.15, amount:2000}, {chance:0.05, amount:5000}])}>
                                                    {t('open')} (1000 FC)
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                )}
                             </div>
                         ) : isBettingLocked ? (
                             <div className="locked-box">
                                <p className="locked-title">{t('bettingFinished')}</p>
                                <p className="locked-sub">{t('bettingsFinishedSub')}</p>
                            </div>
                         ) : (
                             <form onSubmit={submitBets}>
                                <p className="section-title">{t('betFights')}</p>
                                <p className="section-subtitle">{t('betSubtitle')}: {remainingBalance} FC</p>

                                <div className="nick-input-wrap">
                                    <label className="nick-label">{t('yourDiscordNick')}</label>
                                    <input
                                        required
                                        className="nick-input"
                                        placeholder={t('pleaseLogin')}
                                        value={nick}
                                        readOnly={true}
                                        style={{ cursor: 'default', background: nick ? 'rgba(0,0,0,0.2)' : 'rgba(255,255,255,0.04)', fontSize: nick ? '22px' : '14px' }}
                                    />
                                </div>

                                { nick && (
                                <div>
                                    <div style={{marginBottom:'40px'}}>
                                        {FIGHTS.map((f, idx) => {
                                            const currentPick = picks[f.id];
                                            return (
                                                <div key={f.id} className="fight-card">
                                                    <div className="fight-card-header">
                                                        <span className="fight-num">{t('fight')} {String(idx+1).padStart(2,'0')}</span>
                                                        <span className="fight-cat">{f.cat}</span>
                                                    </div>
                                                    <div style={{display:'grid', gridTemplateColumns:'1fr 40px 1fr'}}>
                                                        <button type="button" className={`pick-btn ${currentPick?.fighter === f.p1 ? 'selected' : ''}`} onClick={() => handlePick(f.id, f.p1)}>
                                                            {f.p1.toUpperCase()}
                                                            {currentPick?.fighter === f.p1 && <span className="pick-badge">{t('chosen')}</span>}
                                                        </button>
                                                        <div className="vs-divider">VS</div>
                                                        <button type="button" className={`pick-btn ${currentPick?.fighter === f.p2 ? 'selected' : ''}`} onClick={() => handlePick(f.id, f.p2)}>
                                                            {f.p2.toUpperCase()}
                                                            {currentPick?.fighter === f.p2 && <span className="pick-badge">{t('chosen')}</span>}
                                                        </button>
                                                    </div>
                                                    {currentPick && (
                                                        <div className="stake-area">
                                                            <span className="stake-info">{t('stake')}: <span className="stake-val">{currentPick.stake} FC</span></span>
                                                            <input type="range" min="0" max={remainingBalance + (currentPick.stake || 0)} step="10" value={currentPick.stake || 0} onChange={e => setPicks(prev => ({...prev, [f.id]: {...prev[f.id], stake: parseInt(e.target.value)}}))} className="fc-slider" />
                                                            <span className="stake-info">+ {t('win')}: <span className="stake-win">{currentPick.stake*2} FC</span></span>
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>

                                    <button type="submit" disabled={status==='loading'} className="btn-primary" style={{maxWidth:'100%', fontSize:'18px', padding:'24px', letterSpacing:'0.3em'}}>
                                        {status === 'loading' ? t('sending') : t('submitBet')}
                                    </button>
                                </div>
                                )}
                            </form>
                         )}
                         
                         {/* LEADERBOARD */}
                        <div className="section-divider" style={{marginTop:'64px'}}></div>
                        <p className="section-title">{t('top10')}</p>
                        <p className="section-subtitle">{t('leaderboardSub')}</p>
                        <div style={{border:'1px solid rgba(255,255,255,0.06)'}}>
                            {leaderboard.length === 0 ? (
                                <p style={{padding:'40px', textAlign:'center', fontFamily:'Barlow Condensed', fontSize:'14px', fontWeight:700, letterSpacing:'0.2em', textTransform:'uppercase', color:'rgba(255,255,255,0.2)'}}>{t('noData')}</p>
                            ) : (
                                leaderboard.map((user, idx) => (
                                    <div key={idx} className="lb-row">
                                        <span className={`lb-rank ${idx===0?'gold':idx===1?'silver':idx===2?'bronze':''}`}>#{idx+1}</span>
                                        <span className="lb-nick">{user.nick}</span>
                                        <span className="lb-score">{user.balance} FC</span>
                                    </div>
                                ))
                            )}
                        </div>
                        
                         <footer style={{marginTop:'80px', paddingTop:'40px', borderTop:'1px solid rgba(255,255,255,0.06)', textAlign:'center'}}>
                            <p style={{fontFamily:'Barlow Condensed', fontWeight:900, fontStyle:'italic', fontSize:'11px', letterSpacing:'0.5em', textTransform:'uppercase', color:'rgba(255,255,255,0.12)'}}>RESTREAM © 2026</p>
                        </footer>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
